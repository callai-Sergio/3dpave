[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marshall-simulator"
version = "1.1.0a1"
description = "Corpo de prova Marshall virtual pelo método de Wan et al. (2024) / Virtual Marshall specimen after Wan et al. (2024)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pywebview>=5"]

[project.scripts]
marshall-simulator = "marshall_simulator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marshall_simulator = ["web/*.html", "web/*.js", "web/*.txt"]
